<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/all/all.min.css" rel="stylesheet">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div class="header">
                <div class="computerScore">
                    Computer Score: <span>0</span>
                </div>
                <div class="playerScore"> 
                    Your Score: <span>0</span>
                </div>
            </div>
            <div class="gameBody">
                <div class="action rock" id="rock">
                    <i class="fi fi-rs-hand-fist"></i>
                </div>
                <div class="action paper" id="paper">
                    <i class="fi fi-rr-hand-paper"></i>
                </div>
                <div class="action scissors" id="scissors">
                    <i class="fi fi-rr-hand-peace"></i>
                </div>
            </div>
            <div class="footer">
                Make a selection. Rock, Paper, or Scissors?
            </div>
            <div class="result-wrapper">
                <div class="playerPicked">
                    Player Chose <span> ROCK</span>.
                </div>
                <div class="computerPicked">
                    Computer Chose <span> PAPER</span>.
                </div>
                <div class="result">
                    You Win!
                </div>
                <div class="reset">
                    Reset the score? <u>Click Here</u>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
